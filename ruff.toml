line-length = 120
target-version = "py311"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "N",      # pep8-naming
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default arg (FastAPI Depends false-positive)
    "B904",   # within an except clause, raise exceptions with raise ... from err
]
fixable = ["ALL"]

[lint.isort]
known-first-party = ["parqueryd"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

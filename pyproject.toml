[project]
name = "parqueryd"
version = "2.0.1"
description = "A distribution framework for parquery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL2" }
authors = [
    { name = "Carst Vaartjes", email = "cvaartjes@visualfabriq.com" },
]
maintainers = [
    { name = "Jelle Verstraaten", email = "jverstraaten@visualfabriq.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "azure-storage-blob>=12.4.0",
    "boto3>=1.17.95",
    "configobj>=5.0.6",
    "netifaces>=0.10.9",
    "parquery==2.0.6",
    "psutil>=5.7.2",
    "pyzmq==25.1.2",
    "redis>=3.5",
    "sentry-sdk",
    "smart-open>=1.11.1",
]

[project.urls]
Homepage = "https://github.com/visualfabriq/parqueryd"

[project.scripts]
parqueryd = "parqueryd.node:main"
parqueryd_local = "parqueryd.connect_local:main"

[dependency-groups]
test = [
    "pytest>=4.6.11",
    "pytest-cov>=2.10.0",
    "coverage>=5.0",
    "moto",
    "numpy",
    "pandas>=1.5.3",
]
dev = [
    "ipython>=7.20",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parqueryd*"]
exclude = ["tests*"]

[tool.uv]

[[tool.uv.index]]
name = "private"
url = "https://visualfabriq-103613169272.d.codeartifact.eu-west-1.amazonaws.com/pypi/private/simple"
default = true

[tool.bandit]
exclude_dirs = ["tests", "venv"]
skips = ["B101", "B104"]
